name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare Python
        uses: actions/setup-python@v6
        with:
            python-version: '3.13'

      - name: Install package
        run: |
            pip install .[test]

      - name: Run tests
        run: |
            pytest -s tests
